<template id="soil-macro-template">
  <div id="soil-macro-root" data-composition-id="soil-macro" data-width="3840" data-height="2160">
    <canvas id="sm-canvas" class="clip" data-start="0" data-duration="15" data-track-index="1"></canvas>

    <style>
      #soil-macro-root {
        position: relative;
        width: 3840px;
        height: 2160px;
        background: #04070a;
        overflow: hidden;
      }
      #sm-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const canvas = document.getElementById('sm-canvas');
      const ctx = canvas.getContext('2d');
      const W = 3840, H = 2160;
      canvas.width = W;
      canvas.height = H;
      const T = 15;
      const TAU = Math.PI * 2;

      function mulberry32(a) {
        return function () {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(0x8E1F9C3);

      function hash(x, y) {
        var n = x * 374761393 + y * 668265263;
        n = (n ^ (n >> 13)) * 1274126177;
        return ((n ^ (n >> 16)) & 0x7fffffff) / 0x7fffffff;
      }

      function cycle(k, phi, t) {
        return Math.sin(TAU * k * t / T + phi);
      }

      function camera(t) {
        return {
          x: W / 2 + cycle(1, 1.8, t) * 40,
          y: H / 2 + cycle(2, 0.9, t) * 26,
          s: 1 + cycle(1, 3.0, t) * 0.03,
          r: cycle(1, 4.5, t) * 0.004
        };
      }

      const CYAN = '90,255,200';
      const AMBER = '255,200,110';
      const GREEN = '120,255,160';

      const mycelia = [];
      for (let m = 0; m < 7; m++) {
        const points = [];
        let x = 260 + rand() * (W - 520);
        let y = 220 + rand() * 300;
        const segs = 22;
        for (let s = 0; s < segs; s++) {
          x += (rand() - 0.5) * 220;
          y += 55 + rand() * 70;
          points.push({ x: x, y: y });
        }
        mycelia.push({
          points: points,
          hue: rand() > 0.5 ? '90,255,200' : '180,220,255',
          width: 4 + rand() * 5,
          ph: rand() * TAU,
          k: 1 + Math.floor(rand() * 3)
        });
      }

      const hyphae = [];
      for (let i = 0; i < 340; i++) {
        hyphae.push({
          x: rand() * W,
          y: 200 + rand() * (H - 500),
          len: 20 + rand() * 70,
          angle: rand() * TAU,
          ph: rand() * TAU,
          k: 1 + Math.floor(rand() * 3),
          alpha: 0.06 + rand() * 0.10,
          hue: rand() > 0.6 ? GREEN : CYAN
        });
      }

      const spores = [];
      for (let i = 0; i < 60; i++) {
        spores.push({
          x: rand() * W,
          y: rand() * H,
          ph: rand() * TAU,
          k: 1 + Math.floor(rand() * 3),
          size: 1.5 + rand() * 3,
          alpha: 0.10 + rand() * 0.20
        });
      }

      const aggregates = [];
      for (let i = 0; i < 18; i++) {
        aggregates.push({
          x: rand() * W,
          y: rand() * H,
          r: 30 + rand() * 80,
          ph: rand() * TAU,
          k: 1 + Math.floor(rand() * 3),
          depth: 0.3 + rand() * 0.7
        });
      }

      // ============ LAYER 1 — DARK FIELD BACKGROUND ============
      function drawBg(t) {
        const bg = ctx.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H * 0.45, 2100);
        bg.addColorStop(0, '#0a1210');
        bg.addColorStop(1, '#030608');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        for (let g = 0; g < 5; g++) {
          const gx = hash(g, 5) * W;
          const gy = hash(g, 6) * H;
          const pulse = 0.5 + 0.5 * cycle(1, g * 2.1, t);
          const gg = ctx.createRadialGradient(gx, gy, 20, gx, gy, 750);
          gg.addColorStop(0, `rgba(${CYAN},${0.025 + pulse * 0.02})`);
          gg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = gg;
          ctx.fillRect(gx - 750, gy - 750, 1500, 1500);
        }
      }

      // ============ LAYER 2 — SOIL AGGREGATES (blurred macro DOF) ============
      function drawAggregates(t) {
        for (let i = 0; i < aggregates.length; i++) {
          const ag = aggregates[i];
          const ax = ag.x + cycle(ag.k, ag.ph, t) * 26 * ag.depth;
          const ay = ag.y + cycle(ag.k + 1, ag.ph * 2, t) * 20 * ag.depth;
          const blurAlpha = 0.10 + ag.depth * 0.16;

          const g = ctx.createRadialGradient(ax, ay, 0, ax, ay, ag.r);
          g.addColorStop(0, `rgba(30,45,40,${blurAlpha * 1.4})`);
          g.addColorStop(0.7, `rgba(18,30,28,${blurAlpha})`);
          g.addColorStop(1, 'rgba(10,16,14,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(ax, ay, ag.r, 0, TAU);
          ctx.fill();

          ctx.strokeStyle = `rgba(${GREEN},${0.05 + ag.depth * 0.06})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(ax, ay, ag.r * 0.7, 0, TAU);
          ctx.stroke();
        }
      }

      // ============ LAYER 3 — HYPHAE NETWORK (mid) ============
      function drawHyphae(t) {
        for (let i = 0; i < hyphae.length; i++) {
          const h = hyphae[i];
          const wave = cycle(h.k, h.ph, t) * 5;
          const endX = h.x + Math.cos(h.angle) * h.len;
          const endY = h.y + Math.sin(h.angle) * h.len + wave;
          ctx.strokeStyle = `rgba(${h.hue},${h.alpha * (0.7 + 0.3 * (0.5 + 0.5 * cycle(2, h.ph, t)))})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(h.x, h.y);
          ctx.quadraticCurveTo(h.x + (endX - h.x) * 0.5 + wave, h.y + (endY - h.y) * 0.4, endX, endY);
          ctx.stroke();
        }
      }

      // ============ LAYER 4 — MYCELIUM ROOTS (hero, sharp + glowing) ============
      function drawMycelia(t) {
        ctx.globalCompositeOperation = 'lighter';
        for (let m = 0; m < mycelia.length; m++) {
          const mc = mycelia[m];
          const pulse = 0.5 + 0.5 * cycle(mc.k, mc.ph, t);

          ctx.strokeStyle = `rgba(${mc.hue},${0.5 + pulse * 0.3})`;
          ctx.lineWidth = mc.width;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(mc.points[0].x, mc.points[0].y);
          for (let p = 1; p < mc.points.length; p++) {
            const px = mc.points[p].x + cycle(1, p * 0.6 + mc.ph, t) * 7;
            const py = mc.points[p].y + cycle(2, p * 0.4 + mc.ph, t) * 5;
            ctx.lineTo(px, py);
          }
          ctx.stroke();

          for (let p = 1; p < mc.points.length; p += 2) {
            const gx = mc.points[p].x;
            const gy = mc.points[p].y;
            const gp = 0.5 + 0.5 * cycle(2, p * 0.8 + mc.ph, t);
            const gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, 40);
            gr.addColorStop(0, `rgba(${mc.hue},${0.5 * gp})`);
            gr.addColorStop(1, `rgba(${mc.hue},0)`);
            ctx.fillStyle = gr;
            ctx.beginPath();
            ctx.arc(gx, gy, 40, 0, TAU);
            ctx.fill();
          }

          const tip = mc.points[mc.points.length - 1];
          const tp = 0.5 + 0.5 * cycle(3, mc.ph, t);
          const tg = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 70);
          tg.addColorStop(0, `rgba(${AMBER},${0.6 * tp})`);
          tg.addColorStop(0.4, `rgba(${AMBER},${0.2 * tp})`);
          tg.addColorStop(1, `rgba(${AMBER},0)`);
          ctx.fillStyle = tg;
          ctx.beginPath();
          ctx.arc(tip.x, tip.y, 70, 0, TAU);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }

      // ============ LAYER 5 — SPORES + ROOT EXUDATES ============
      function drawSpores(t) {
        for (let i = 0; i < spores.length; i++) {
          const sp = spores[i];
          const sx = sp.x + cycle(sp.k, sp.ph, t) * 70;
          const sy = sp.y + cycle(sp.k + 1, sp.ph * 2, t) * 50;
          const pulse = 0.4 + 0.6 * (0.5 + 0.5 * cycle(2, sp.ph, t));
          ctx.fillStyle = `rgba(${CYAN},${sp.alpha * pulse})`;
          ctx.beginPath();
          ctx.arc(sx, sy, sp.size * pulse, 0, TAU);
          ctx.fill();
        }
      }

      // ============ LAYER 5B — SPRINGTAILS (moving organisms with trails) ============
      const springtails = [];
      for (let i = 0; i < 10; i++) {
        springtails.push({
          x: rand() * W,
          y: rand() * H,
          ph: rand() * TAU,
          k: 1 + Math.floor(rand() * 3),
          speed: 0.4 + rand() * 0.5,
          size: 5 + rand() * 7,
          dir: rand() * TAU
        });
      }

      function drawSpringtails(t) {
        for (let i = 0; i < springtails.length; i++) {
          const st = springtails[i];
          const pathK = 2 + (i % 3);
          const sx = st.x + cycle(pathK, st.ph, t) * 340 * st.speed;
          const sy = st.y + cycle(pathK + 1, st.ph * 1.7, t) * 240 * st.speed;
          const dirAngle = Math.atan2(
            cycle(pathK + 1, st.ph * 1.7 + 0.1, t) - cycle(pathK + 1, st.ph * 1.7, t),
            cycle(pathK, st.ph + 0.1, t) - cycle(pathK, st.ph, t)
          );

          ctx.fillStyle = 'rgba(255,230,160,0.14)';
          for (let tr = 0; tr < 12; tr++) {
            const tf = (t * 2 + tr * 0.08) % 1;
            const tx = st.x + cycle(pathK, st.ph + tf * 3, t) * 340 * st.speed * tf;
            const ty = st.y + cycle(pathK + 1, st.ph * 1.7 + tf * 3, t) * 240 * st.speed * tf;
            ctx.beginPath();
            ctx.arc(tx, ty, st.size * (1 - tf) * 0.4, 0, TAU);
            ctx.fill();
          }

          const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, st.size * 3);
          g.addColorStop(0, `rgba(255,235,170,${0.35 + 0.3 * (0.5 + 0.5 * cycle(2, st.ph, t))})`);
          g.addColorStop(1, 'rgba(255,235,170,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(sx, sy, st.size * 3, 0, TAU);
          ctx.fill();

          ctx.fillStyle = '#fff3d0';
          ctx.beginPath();
          ctx.arc(sx, sy, st.size, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#3a2c14';
          ctx.beginPath();
          ctx.arc(sx + Math.cos(dirAngle) * st.size * 0.5, sy + Math.sin(dirAngle) * st.size * 0.5, st.size * 0.3, 0, TAU);
          ctx.fill();
        }
      }

      // ============ LAYER 5C — BIOFILM SHEEN (water film interference) ============
      function drawBiofilm(t) {
        const sheens = [
          { x: 0.3, y: 0.35, r: 500, hue: '90,255,200', ph: 0.5 },
          { x: 0.68, y: 0.60, r: 620, hue: '180,220,255', ph: 2.4 },
          { x: 0.85, y: 0.25, r: 380, hue: '255,200,110', ph: 4.2 }
        ];
        ctx.globalCompositeOperation = 'lighter';
        for (let s = 0; s < sheens.length; s++) {
          const sh = sheens[s];
          const sx = sh.x * W + cycle(1, sh.ph, t) * 70;
          const sy = sh.y * H + cycle(2, sh.ph * 2, t) * 50;
          const pulse = 0.5 + 0.5 * cycle(2, sh.ph, t);
          const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sh.r);
          g.addColorStop(0, `rgba(${sh.hue},${0.035 + pulse * 0.025})`);
          g.addColorStop(0.6, `rgba(${sh.hue},${0.015})`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.fillRect(sx - sh.r, sy - sh.r, sh.r * 2, sh.r * 2);

          ctx.strokeStyle = `rgba(${sh.hue},${0.06 + pulse * 0.05})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(sx, sy, sh.r * (0.4 + pulse * 0.25), 0, TAU);
          ctx.stroke();
        }
        ctx.globalCompositeOperation = 'source-over';
      }

      // ============ LAYER 5D — GERMINATING SEEDLING (sprout life cycle) ============
      const sprout = { x: W * 0.55, y: H * 0.62, ph: 1.4 };
      const leafParticles = [];
      for (let i = 0; i < 8; i++) {
        leafParticles.push({
          angle: (i / 8) * TAU + 0.3,
          dist: 30 + hash(i, 7) * 60,
          k: 1 + (i % 2)
        });
      }

      function drawSprout(t) {
        const growth = 0.5 + 0.5 * cycle(2, sprout.ph, t);
        const h = growth * 220;
        const sx = sprout.x, sy = sprout.y;

        ctx.strokeStyle = '#3f6b33';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.quadraticCurveTo(sx + 8, sy - h * 0.5, sx - 6, sy - h);
        ctx.stroke();

        const sway = cycle(2, sprout.ph * 2, t) * 0.25;
        ctx.save();
        ctx.translate(sx - 6, sy - h);
        ctx.rotate(sway);
        for (let i = 0; i < 2; i++) {
          ctx.fillStyle = i === 0 ? '#4c8a3a' : '#3f6b33';
          ctx.beginPath();
          ctx.ellipse(18, i * 26 - 14, 40, 18, -0.6 + i * 1.2, 0, TAU);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,220,140,0.9)';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, TAU);
        ctx.fill();
        ctx.restore();

        for (let i = 0; i < leafParticles.length; i++) {
          const lp = leafParticles[i];
          const drift = cycle(lp.k, lp.angle, t) * lp.dist;
          const px = sx + Math.cos(lp.angle) * drift + 30;
          const py = sy - Math.abs(Math.sin(lp.angle)) * drift * 0.6 - 40;
          ctx.fillStyle = `rgba(140,210,110,${0.10 + 0.10 * (0.5 + 0.5 * cycle(2, lp.angle * 3, t))})`;
          ctx.beginPath();
          ctx.arc(px, py, 5 + hash(i, 9) * 6, 0, TAU);
          ctx.fill();
        }

        const glow = ctx.createRadialGradient(sx, sy - h, 0, sx, sy - h, 120);
        glow.addColorStop(0, `rgba(160,230,130,${0.10 + growth * 0.08})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(sx - 120, sy - h - 120, 240, 240);
      }

      // ============ LAYER 5E — WATER DROPLET RING (dew on soil) ============
      const droplets = [];
      for (let i = 0; i < 14; i++) {
        droplets.push({
          x: rand() * W,
          y: rand() * H,
          r: 6 + rand() * 16,
          ph: rand() * TAU,
          k: 1 + (i % 2)
        });
      }

      function drawDroplets(t) {
        for (let i = 0; i < droplets.length; i++) {
          const d = droplets[i];
          const ripple = 0.5 + 0.5 * cycle(d.k, d.ph, t);
          const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 2);
          g.addColorStop(0, `rgba(200,240,255,${0.10 + ripple * 0.15})`);
          g.addColorStop(0.5, `rgba(200,240,255,${0.03})`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.fillRect(d.x - d.r * 2, d.y - d.r * 2, d.r * 4, d.r * 4);

          ctx.strokeStyle = `rgba(220,250,255,${0.16 + ripple * 0.12})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, TAU);
          ctx.stroke();

          ctx.fillStyle = `rgba(255,255,255,${0.35 + ripple * 0.25})`;
          ctx.beginPath();
          ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.25, 0, TAU);
          ctx.fill();
        }
      }

      // ============ LAYER 6 — FILM (grain, halation, vignette) ============
      function drawGrain(t) {
        const frame = Math.floor(t * 60) % 900;
        ctx.save();
        for (let i = 0; i < 1500; i++) {
          const gx = hash(i, frame) * W;
          const gy = hash(i, frame + 4000) * H;
          const gs = 1 + hash(i, frame + 8000) * 2;
          ctx.fillStyle = `rgba(255,255,255,${hash(i, frame + 12000) * 0.035})`;
          ctx.fillRect(gx, gy, gs, gs);
        }
        ctx.restore();
      }

      function drawHalation(t) {
        const pulse = 0.5 + 0.5 * cycle(1, 2.4, t);
        const h = ctx.createRadialGradient(W * 0.5, H * 0.4, 60, W * 0.5, H * 0.4, 1400);
        h.addColorStop(0, `rgba(${GREEN},${0.03 + pulse * 0.025})`);
        h.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = h;
        ctx.fillRect(0, 0, W, H);
      }

      function drawVignette() {
        const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.95);
        v.addColorStop(0, 'rgba(0,0,0,0)');
        v.addColorStop(1, 'rgba(0,0,0,0.68)');
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);
      }

      function drawDOF() {
        ctx.fillStyle = 'rgba(2,5,6,0.18)';
        ctx.fillRect(0, 0, W, H);
        const b = ctx.createLinearGradient(0, 0, 0, 320);
        b.addColorStop(0, 'rgba(0,0,0,0.40)');
        b.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = b;
        ctx.fillRect(0, 0, W, 320);
        const b2 = ctx.createLinearGradient(0, H, 0, H - 380);
        b2.addColorStop(0, 'rgba(0,0,0,0.40)');
        b2.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = b2;
        ctx.fillRect(0, H - 380, W, 380);
      }

      function drawFrame(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        drawBg(t);
        const cam = camera(t);

        ctx.save();
        ctx.translate(cam.x * 0.3, cam.y * 0.3);
        drawAggregates(t);
        ctx.restore();

        ctx.save();
        ctx.translate(cam.x * 0.65, cam.y * 0.65);
        ctx.rotate(cam.r * 0.5);
        drawHyphae(t);
        ctx.restore();

        ctx.save();
        ctx.translate(cam.x, cam.y);
        ctx.rotate(cam.r);
        ctx.scale(cam.s, cam.s);
        ctx.translate(-W / 2, -H / 2);
        drawMycelia(t);
        drawSpores(t);
        drawSpringtails(t);
        drawSprout(t);
        drawDroplets(t);
        ctx.restore();

        drawBiofilm(t);

        drawDOF();
        drawHalation(t);
        drawVignette();
        drawGrain(t);
      }

      tl.to({}, {
        duration: T,
        ease: 'none',
        onUpdate: function () { drawFrame(this.time()); }
      }, 0);

      window.__timelines['soil-macro'] = tl;
    </script>
  </div>
</template>
