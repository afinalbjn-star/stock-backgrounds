name: Render Blender Clip 4K60

# Manual only, for the same reason as render.yml: a 720-frame Cycles render is
# expensive and must be started by a person. No push, no schedule.
on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene folder under blender/scenes/'
        required: true
        default: '003_pcb-ai-chip-loop'
        type: choice
        options:
          - 003_pcb-ai-chip-loop
      engine:
        description: 'Render engine'
        required: true
        default: 'cycles'
        type: choice
        options: [cycles, eevee]
      samples:
        description: 'Samples per frame (cycles)'
        required: true
        default: '256'
        type: choice
        options: ['64', '128', '256', '512']
      start_frame:
        description: 'First frame'
        required: false
        default: '1'
      end_frame:
        description: 'Last frame (720 = full 12 s loop)'
        required: false
        default: '720'
      run_check:
        description: 'Verify the loop closes and QC the frames before encoding'
        required: true
        default: 'true'
        type: boolean

concurrency:
  group: render-blender-4k-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  SCENE_DIR: blender/scenes/${{ inputs.scene }}

jobs:
  render:
    name: Render ${{ inputs.scene }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          # 720 lossless 16-bit 4K PNGs need tens of GB; the preinstalled
          # SDKs are dead weight here.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /

      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '5.2'

      - name: Verify Blender
        run: blender --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Prepare scene directory
        run: |
          mkdir -p "${{ env.SCENE_DIR }}/renders"
          test -f "${{ env.SCENE_DIR }}/scene.blend" || {
            echo "::error::no scene.blend in ${{ env.SCENE_DIR }}"; exit 1; }

      - name: Inspect scene
        run: blender -b "${{ env.SCENE_DIR }}/scene.blend" -P blender/scripts/inspect_scene.py

      - name: Render 4K 60fps frames
        env:
          ENGINE: ${{ inputs.engine }}
          SAMPLES: ${{ inputs.samples }}
          START_FRAME: ${{ inputs.start_frame }}
          END_FRAME: ${{ inputs.end_frame }}
          FRAMES_DIR: ${{ env.SCENE_DIR }}/renders
          RES_X: '3840'
          RES_Y: '2160'
          FPS: '60'
        run: |
          blender -b "${{ env.SCENE_DIR }}/scene.blend" \
            -P blender/scripts/ci_settings.py \
            -a

      - name: Count frames
        run: |
          count=$(ls -1 "${{ env.SCENE_DIR }}/renders"/pcb_*.png 2>/dev/null | wc -l)
          echo "frames: $count"
          du -sh "${{ env.SCENE_DIR }}/renders"
          df -h /
          echo "FRAME_COUNT=$count" >> "$GITHUB_ENV"

      - name: Upload raw frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scene }}-frames
          path: ${{ env.SCENE_DIR }}/renders/pcb_*.png
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn

      - name: Loop seam QC
        if: ${{ inputs.run_check }}
        continue-on-error: true
        env:
          FPS: '60'
          EXPECTED_FRAMES: '720'
          FRAME_PREFIX: 'pcb_'
          PSNR_FLOOR_DB: '25'
        run: |
          if [ "${FRAME_COUNT:-0}" -lt 3 ]; then
            echo "::notice::not enough frames to check the seam"
            exit 0
          fi
          # A partial render has no wrap point, so only enforce the seam
          # verdict when the whole 720-frame period was rendered.
          if [ "${{ inputs.start_frame }}" = "1" ] && [ "${{ inputs.end_frame }}" = "720" ]; then
            SEAM_STRICT=1
          else
            echo "::notice::partial range, seam reported but not enforced"
            SEAM_STRICT=0
          fi
          SEAM_STRICT="$SEAM_STRICT" python blender/scripts/qc_loop.py "${{ env.SCENE_DIR }}/renders"
          cat "${{ env.SCENE_DIR }}/renders/loop_qc.json"

      - name: Encode masters
        env:
          FPS: '60'
          EXPECTED_FRAMES: '720'
          FRAME_PREFIX: 'pcb_'
          SLUG: ${{ inputs.scene }}
        run: python blender/scripts/encode.py "${{ env.SCENE_DIR }}/renders"

      - name: Verify delivery spec
        env:
          SLUG: ${{ inputs.scene }}
        run: |
          set -euo pipefail
          f="${{ env.SCENE_DIR }}/renders/${{ inputs.scene }}-4k.mp4"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,pix_fmt -of default=nw=1 "$f" | tee probe.txt
          grep -qx 'width=3840'        probe.txt || { echo "::error::width is not 3840"; exit 1; }
          grep -qx 'height=2160'       probe.txt || { echo "::error::height is not 2160"; exit 1; }
          grep -qx 'r_frame_rate=60/1' probe.txt || { echo "::error::frame rate is not 60fps"; exit 1; }
          grep -q  'pix_fmt=yuv420p'   probe.txt || { echo "::error::not 8-bit 4:2:0"; exit 1; }
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          echo "duration: $dur s"
          awk -v d="$dur" 'BEGIN{ if (d < 9.9 || d > 15.1) { print "::error::duration out of the 10-15s stock range"; exit 1 } }'

      - name: Delivery notes
        if: always()
        run: |
          {
            echo "### ${{ inputs.scene }}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| resolution | 3840x2160 (4K UHD) |"
            echo "| frame rate | 60 fps |"
            echo "| codec | H.264 / yuv420p / Rec.709 |"
            echo "| engine | ${{ inputs.engine }} |"
            echo "| samples | ${{ inputs.samples }} |"
            echo "| frames rendered | ${FRAME_COUNT:-0} |"
            echo "| loop seam PSNR | see QC job log |"
            echo
            ls -lh "${{ env.SCENE_DIR }}/renders" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scene }}-4k60
          path: |
            ${{ env.SCENE_DIR }}/renders/*-4k.mp4
            ${{ env.SCENE_DIR }}/renders/*-4k-prores.mov
            ${{ env.SCENE_DIR }}/renders/*-contact-sheet.jpg
            ${{ env.SCENE_DIR }}/renders/*-poster.png
            ${{ env.SCENE_DIR }}/renders/loop_qc.json
            ${{ env.SCENE_DIR }}/renders/render-report.json
            ${{ env.SCENE_DIR }}/metadata.json
          retention-days: 30
          if-no-files-found: error