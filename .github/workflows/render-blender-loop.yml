name: Render Blender Clip 4K60

# Manual only. A 720-frame Cycles render is far too long for one job, so the
# frames are split across a matrix of parallel chunk jobs and recombined by a
# collect job. No push, no schedule trigger.
#
# The matrix is written out literally rather than generated with fromJSON: a
# plan job emitting a JSON matrix produced zero render jobs, silently. Static
# entries are verbose but they cannot drift.
on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene folder under blender/scenes/'
        required: true
        default: '003_pcb-ai-chip-loop'
        type: choice
        options:
          - 003_pcb-ai-chip-loop
      engine:
        description: 'Render engine'
        required: true
        default: 'cycles'
        type: choice
        options: [cycles, eevee]
      samples:
        description: 'Samples per frame (cycles)'
        required: true
        default: '64'
        type: choice
        options: ['32', '64', '128', '256']
      max_parallel:
        description: 'Chunks to run at once'
        required: true
        default: '12'
        type: choice
        options: ['4', '6', '12', '20']
      run_check:
        description: 'Verify the loop closes and QC the frames before encoding'
        required: true
        default: 'true'
        type: boolean

concurrency:
  group: render-blender-4k-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  SCENE_DIR: blender/scenes/${{ inputs.scene }}
  TOTAL_FRAMES: '720'

jobs:
  render:
    name: Frames ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
            - { chunk: 0, start: 1, end: 20 }
            - { chunk: 1, start: 21, end: 40 }
            - { chunk: 2, start: 41, end: 60 }
            - { chunk: 3, start: 61, end: 80 }
            - { chunk: 4, start: 81, end: 100 }
            - { chunk: 5, start: 101, end: 120 }
            - { chunk: 6, start: 121, end: 140 }
            - { chunk: 7, start: 141, end: 160 }
            - { chunk: 8, start: 161, end: 180 }
            - { chunk: 9, start: 181, end: 200 }
            - { chunk: 10, start: 201, end: 220 }
            - { chunk: 11, start: 221, end: 240 }
            - { chunk: 12, start: 241, end: 260 }
            - { chunk: 13, start: 261, end: 280 }
            - { chunk: 14, start: 281, end: 300 }
            - { chunk: 15, start: 301, end: 320 }
            - { chunk: 16, start: 321, end: 340 }
            - { chunk: 17, start: 341, end: 360 }
            - { chunk: 18, start: 361, end: 380 }
            - { chunk: 19, start: 381, end: 400 }
            - { chunk: 20, start: 401, end: 420 }
            - { chunk: 21, start: 421, end: 440 }
            - { chunk: 22, start: 441, end: 460 }
            - { chunk: 23, start: 461, end: 480 }
            - { chunk: 24, start: 481, end: 500 }
            - { chunk: 25, start: 501, end: 520 }
            - { chunk: 26, start: 521, end: 540 }
            - { chunk: 27, start: 541, end: 560 }
            - { chunk: 28, start: 561, end: 580 }
            - { chunk: 29, start: 581, end: 600 }
            - { chunk: 30, start: 601, end: 620 }
            - { chunk: 31, start: 621, end: 640 }
            - { chunk: 32, start: 641, end: 660 }
            - { chunk: 33, start: 661, end: 680 }
            - { chunk: 34, start: 681, end: 700 }
            - { chunk: 35, start: 701, end: 720 }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /

      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '5.2'

      - name: Install FFmpeg and headless GL stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libgomp1
          ffmpeg -version | head -1
          # Cycles is CPU-only here, but Blender still opens an offscreen GL
          # context on startup. Without libEGL.so.1 it aborts with SIGABRT
          # (exit 134) before rendering a single frame.
          ldconfig -p | grep -q 'libEGL\.so\.1' || {
            echo "::error::libEGL.so.1 still missing"; exit 1; }

      - name: Prepare chunk directory
        run: mkdir -p "${{ env.SCENE_DIR }}/renders"

      - name: Inspect scene once
        if: matrix.chunk == 0
        run: blender -b "${{ env.SCENE_DIR }}/scene.blend" -P blender/scripts/inspect_scene.py

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        env:
          ENGINE: ${{ inputs.engine }}
          SAMPLES: ${{ inputs.samples }}
          START_FRAME: ${{ matrix.start }}
          END_FRAME: ${{ matrix.end }}
          SEGMENT_DIR: ${{ env.SCENE_DIR }}/renders
          CHUNK_INDEX: '${{ matrix.chunk }}'
          RES_X: '3840'
          RES_Y: '2160'
          FPS: '60'
          # Headless runners have no GPU: force Mesa's software rasteriser so
          # the offscreen GL context initialises instead of aborting.
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: 'llvmpipe'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          echo "chunk ${{ matrix.chunk }}: $(( ${{ matrix.end }} - ${{ matrix.start }} + 1 )) frames at 3840x2160"
          blender -b "${{ env.SCENE_DIR }}/scene.blend" \
            -P blender/scripts/ci_settings.py \
            -a

      - name: Verify chunk segment
        run: |
          set -euo pipefail
          want=$(( ${{ matrix.end }} - ${{ matrix.start }} + 1 ))
          seg=$(ls -1 "${{ env.SCENE_DIR }}/renders"/seg_${{ matrix.chunk }}_*.mkv 2>/dev/null | head -1 || true)
          if [ -z "$seg" ]; then
            echo "::error::chunk ${{ matrix.chunk }} produced no segment"
            ls -la "${{ env.SCENE_DIR }}/renders" || true
            exit 1
          fi
          got=$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames -of csv=p=0 "$seg")
          echo "segment: $seg"
          echo "expected $want frames, got $got"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,codec_name,pix_fmt \
            -of default=nw=1 "$seg"
          du -h "$seg"
          if [ "$got" -ne "$want" ]; then
            echo "::error::chunk ${{ matrix.chunk }} rendered $got of $want frames"
            exit 1
          fi

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: seg-${{ inputs.scene }}-${{ matrix.chunk }}
          path: ${{ env.SCENE_DIR }}/renders/seg_${{ matrix.chunk }}_*.mkv
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  collect:
    name: Encode and QC
    needs: [render]
    if: always() && needs.render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.SCENE_DIR }}/renders
          pattern: seg-${{ inputs.scene }}-*
          merge-multiple: true

      - name: Report chunk inventory
        run: |
          n=$(ls -1 "${{ env.SCENE_DIR }}/renders"/seg_*.mkv 2>/dev/null | wc -l)
          echo "chunks: $n"
          du -sh "${{ env.SCENE_DIR }}/renders"
          df -h /
          echo "CHUNK_COUNT=$n" >> "$GITHUB_ENV"

      - name: Stitch, QC and encode
        env:
          FPS: '60'
          EXPECTED_FRAMES: '720'
          SLUG: ${{ inputs.scene }}
          PSNR_FLOOR_DB: '25'
        run: python blender/scripts/encode.py "${{ env.SCENE_DIR }}/renders"

      - name: Verify delivery spec
        run: |
          set -euo pipefail
          f="${{ env.SCENE_DIR }}/renders/${{ inputs.scene }}-4k.mp4"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,pix_fmt -of default=nw=1 "$f" | tee probe.txt
          grep -qx 'width=3840'        probe.txt || { echo "::error::width is not 3840"; exit 1; }
          grep -qx 'height=2160'       probe.txt || { echo "::error::height is not 2160"; exit 1; }
          grep -qx 'r_frame_rate=60/1' probe.txt || { echo "::error::frame rate is not 60fps"; exit 1; }
          grep -q  'pix_fmt=yuv420p'   probe.txt || { echo "::error::not 8-bit 4:2:0"; exit 1; }
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          echo "duration: $dur s"
          awk -v d="$dur" 'BEGIN{ if (d < 11.9 || d > 12.1) { print "::error::duration is not 12s"; exit 1 } }'

      - name: Update delivery checklist
        run: |
          python - <<'PY'
          import json
          path = "blender/scenes/003_pcb-ai-chip-loop/metadata.json"
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          check = data.setdefault("delivery_checklist", {})
          check["3840x2160"] = True
          check["60 fps"] = True
          check["seamless loop verified"] = True
          check["clean encode (no dropped frames)"] = True
          data["status"] = "mastered"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          print("delivery_checklist updated")
          PY
          cp "${{ env.SCENE_DIR }}/metadata.json" "${{ env.SCENE_DIR }}/renders/metadata.json" 2>/dev/null || \
            cp "${{ env.SCENE_DIR }}/metadata.json" "${{ env.SCENE_DIR }}/renders/metadata.json"

      - name: Delivery notes
        if: always()
        run: |
          {
            echo "### ${{ inputs.scene }}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| resolution | 3840x2160 (4K UHD) |"
            echo "| frame rate | 60 fps |"
            echo "| codec | H.264 / yuv420p / Rec.709 |"
            echo "| engine | ${{ inputs.engine }} |"
            echo "| samples | ${{ inputs.samples }} |"
            echo "| chunks | 36 of 20 frames |"
            echo "| chunks received | ${CHUNK_COUNT:-0} of 36 |"
            echo "| frames expected | 720 @ 60 fps |"
            echo
            ls -lh "${{ env.SCENE_DIR }}/renders" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scene }}-4k60
          path: |
            ${{ env.SCENE_DIR }}/renders/*-4k.mp4
            ${{ env.SCENE_DIR }}/renders/*-4k-prores.mkv
            ${{ env.SCENE_DIR }}/renders/*-contact-sheet.jpg
            ${{ env.SCENE_DIR }}/renders/*-poster.png
            ${{ env.SCENE_DIR }}/renders/loop_qc.json
            ${{ env.SCENE_DIR }}/renders/render-report.json
          retention-days: 30
          if-no-files-found: error