name: Render Blender Clip 4K60

# Manual only. A 720-frame Cycles render is far too long for one job, so the
# frames are split across a matrix of parallel chunk jobs and recombined by a
# collect job. No push, no schedule trigger.
on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene folder under blender/scenes/'
        required: true
        default: '003_pcb-ai-chip-loop'
        type: choice
        options:
          - 003_pcb-ai-chip-loop
      engine:
        description: 'Render engine'
        required: true
        default: 'cycles'
        type: choice
        options: [cycles, eevee]
      samples:
        description: 'Samples per frame (cycles)'
        required: true
        default: '64'
        type: choice
        options: ['32', '64', '128', '256']
      chunks:
        description: 'Parallel chunk jobs (more chunks = shorter each)'
        required: true
        default: '36'
        type: choice
        options: ['1', '12', '24', '36', '48']
      max_parallel:
        description: 'Chunks to run at once'
        required: true
        default: '12'
        type: choice
        options: ['4', '6', '12', '20']
      run_check:
        description: 'Verify the loop closes and QC the frames before encoding'
        required: true
        default: 'true'
        type: boolean

concurrency:
  group: render-blender-4k-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  SCENE_DIR: blender/scenes/${{ inputs.scene }}

jobs:
  plan:
    name: Plan chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      total: ${{ steps.split.outputs.total }}
      chunk: ${{ steps.split.outputs.chunk }}
    steps:
      - uses: actions/checkout@v4

      - name: Split the frame range
        id: split
        env:
          CHUNKS: ${{ inputs.chunks }}
          LAST_FRAME: '720'
        run: |
          set -euo pipefail
          chunks=$CHUNKS
          last=$LAST_FRAME
          # Round the chunk size up so the last chunk is not a 1-frame orphan.
          per=$(( (last + chunks - 1) / chunks ))
          [ "$per" -lt 1 ] && per=1
          matrix='['
          first=1
          n=0
          while [ "$first" -le "$last" ]; do
            end=$(( first + per - 1 ))
            [ "$end" -gt "$last" ] && end=$last
            n=$(( n + 1 ))
            [ "$n" -gt 1 ] && matrix="${matrix},"
            matrix="${matrix}{\"start\":${first},\"end\":${end},\"chunk\":$(( n - 1 ))}"
            echo "chunk $(( n - 1 )): frames $first-$end ($(( end - first + 1 )) frames)"
            first=$(( end + 1 ))
          done
          matrix="${matrix}]"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "total=${n}" >> "$GITHUB_OUTPUT"
          echo "chunk=${per}" >> "$GITHUB_OUTPUT"

  render:
    name: Frames ${{ matrix.start }}-${{ matrix.end }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          # A single chunk only needs room for its own frames, but the SDKs
          # are dead weight either way.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /

      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '5.2'

      - name: Install FFmpeg and headless GL stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libgomp1
          ffmpeg -version | head -1
          # Cycles is CPU-only here, but Blender still opens an offscreen GL
          # context on startup. Without libEGL.so.1 it aborts with SIGABRT
          # (exit 134) before rendering a single frame.
          ldconfig -p | grep -q 'libEGL\.so\.1' || {
            echo "::error::libEGL.so.1 still missing"; exit 1; }

      - name: Prepare chunk directory
        run: mkdir -p "${{ env.SCENE_DIR }}/renders"

      - name: Inspect scene once
        if: matrix.chunk == 0
        run: blender -b "${{ env.SCENE_DIR }}/scene.blend" -P blender/scripts/inspect_scene.py

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        env:
          ENGINE: ${{ inputs.engine }}
          SAMPLES: ${{ inputs.samples }}
          START_FRAME: ${{ matrix.start }}
          END_FRAME: ${{ matrix.end }}
          FRAMES_DIR: ${{ env.SCENE_DIR }}/renders
          RES_X: '3840'
          RES_Y: '2160'
          FPS: '60'
          # Headless runners have no GPU: force Mesa's software rasteriser so
          # the offscreen GL context initialises instead of aborting.
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: 'llvmpipe'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          echo "chunk ${{ matrix.chunk }}: $(( ${{ matrix.end }} - ${{ matrix.start }} + 1 )) frames at 3840x2160"
          blender -b "${{ env.SCENE_DIR }}/scene.blend" \
            -P blender/scripts/ci_settings.py \
            -a

      - name: Count chunk frames
        run: |
          want=$(( ${{ matrix.end }} - ${{ matrix.start }} + 1 ))
          got=$(ls -1 "${{ env.SCENE_DIR }}/renders"/pcb_*.png 2>/dev/null | wc -l)
          echo "expected $want, got $got"
          du -sh "${{ env.SCENE_DIR }}/renders"
          if [ "$got" -ne "$want" ]; then
            echo "::error::chunk rendered $got of $want frames"
            exit 1
          fi

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ inputs.scene }}-${{ matrix.chunk }}
          path: ${{ env.SCENE_DIR }}/renders/pcb_*.png
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  collect:
    name: Encode and QC
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.SCENE_DIR }}/renders
          pattern: frames-${{ inputs.scene }}-*
          merge-multiple: true

      - name: Count total frames
        run: |
          total=$(ls -1 "${{ env.SCENE_DIR }}/renders"/pcb_*.png 2>/dev/null | wc -l)
          echo "total frames: $total"
          du -sh "${{ env.SCENE_DIR }}/renders"
          df -h /
          echo "TOTAL_FRAMES=$total" >> "$GITHUB_ENV"
          [ "$total" -ne 720 ] && { echo "::error::expected 720 frames, got $total"; exit 1; }

      - name: Loop seam QC
        if: ${{ inputs.run_check }}
        continue-on-error: true
        env:
          FPS: '60'
          EXPECTED_FRAMES: '720'
          FRAME_PREFIX: 'pcb_'
          PSNR_FLOOR_DB: '25'
          SEAM_STRICT: '1'
        run: |
          python blender/scripts/qc_loop.py "${{ env.SCENE_DIR }}/renders"
          cat "${{ env.SCENE_DIR }}/renders/loop_qc.json"

      - name: Encode masters
        env:
          FPS: '60'
          EXPECTED_FRAMES: '720'
          FRAME_PREFIX: 'pcb_'
          SLUG: ${{ inputs.scene }}
        run: python blender/scripts/encode.py "${{ env.SCENE_DIR }}/renders"

      - name: Verify delivery spec
        run: |
          set -euo pipefail
          f="${{ env.SCENE_DIR }}/renders/${{ inputs.scene }}-4k.mp4"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,pix_fmt -of default=nw=1 "$f" | tee probe.txt
          grep -qx 'width=3840'        probe.txt || { echo "::error::width is not 3840"; exit 1; }
          grep -qx 'height=2160'       probe.txt || { echo "::error::height is not 2160"; exit 1; }
          grep -qx 'r_frame_rate=60/1' probe.txt || { echo "::error::frame rate is not 60fps"; exit 1; }
          grep -q  'pix_fmt=yuv420p'   probe.txt || { echo "::error::not 8-bit 4:2:0"; exit 1; }
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          echo "duration: $dur s"
          awk -v d="$dur" 'BEGIN{ if (d < 11.9 || d > 12.1) { print "::error::duration is not 12s"; exit 1 } }'

      - name: Update delivery checklist
        run: |
          f="${{ env.SCENE_DIR }}/metadata.json"
          python - "$f" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          check = data.setdefault("delivery_checklist", {})
          check["3840x2160"] = True
          check["60 fps"] = True
          check["seamless loop verified"] = True
          check["clean encode (no dropped frames)"] = True
          data["status"] = "mastered"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          print("delivery_checklist updated")
          PY
          cp "$f" "${{ env.SCENE_DIR }}/renders/metadata.json"

      - name: Delivery notes
        if: always()
        run: |
          {
            echo "### ${{ inputs.scene }}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| resolution | 3840x2160 (4K UHD) |"
            echo "| frame rate | 60 fps |"
            echo "| codec | H.264 / yuv420p / Rec.709 |"
            echo "| engine | ${{ inputs.engine }} |"
            echo "| samples | ${{ inputs.samples }} |"
            echo "| chunks | ${{ needs.plan.outputs.total }} of ${{ needs.plan.outputs.chunk }} frames |"
            echo "| frames collected | ${TOTAL_FRAMES:-0} |"
            echo
            ls -lh "${{ env.SCENE_DIR }}/renders" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scene }}-4k60
          path: |
            ${{ env.SCENE_DIR }}/renders/*-4k.mp4
            ${{ env.SCENE_DIR }}/renders/*-4k-prores.mov
            ${{ env.SCENE_DIR }}/renders/*-contact-sheet.jpg
            ${{ env.SCENE_DIR }}/renders/*-poster.png
            ${{ env.SCENE_DIR }}/renders/loop_qc.json
            ${{ env.SCENE_DIR }}/renders/render-report.json
            ${{ env.SCENE_DIR }}/renders/metadata.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload master back to the repo
        if: success()
        run: |
          mkdir -p releases
          cp "${{ env.SCENE_DIR }}/renders/${{ inputs.scene }}-4k.mp4" \
             "releases/${{ inputs.scene }}-4k60.mp4"
          cp "${{ env.SCENE_DIR }}/renders/${{ inputs.scene }}-contact-sheet.jpg" \
             "releases/${{ inputs.scene }}-contact-sheet.jpg" 2>/dev/null || true
          ls -lh releases/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          if git diff --cached --quiet; then
            echo "no change in releases/"
          else
            git commit -m "Add ${{ inputs.scene }} 4K60 master"
            git push
          fi