name: Render Blender Clip 4K30

# Manual only. A 360-frame Cycles render is far too long for one runner, so the
# frames are split across a matrix of parallel chunk jobs and stitched by a
# collect job. No push, no schedule trigger.
#
# The matrix is literal rather than generated with fromJSON: a plan job that
# emitted a JSON matrix produced zero render jobs, silently.
#
# max-parallel is hardcoded. workflow_dispatch inputs are always strings and
# max-parallel wants a number, so the expression form was rejected and again
# no render job was created at all.
on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene folder under blender/scenes/'
        required: true
        default: '003_pcb-ai-chip-loop'
        type: choice
        options:
          - 003_pcb-ai-chip-loop
      engine:
        description: 'Render engine'
        required: true
        default: 'cycles'
        type: choice
        options: [cycles, eevee]
      samples:
        description: 'Samples per frame (cycles)'
        required: true
        default: '32'
        type: choice
        options: ['16', '32', '64', '128']
      run_check:
        description: 'QC the seam before encoding'
        required: true
        default: 'true'
        type: boolean

concurrency:
  group: render-blender-4k30-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  SCENE_DIR: blender/scenes/${{ inputs.scene }}
  TOTAL_FRAMES: '360'

jobs:
  render:
    name: Frames ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
            - { chunk: 0, start: 1, end: 5 }
            - { chunk: 1, start: 6, end: 10 }
            - { chunk: 2, start: 11, end: 15 }
            - { chunk: 3, start: 16, end: 20 }
            - { chunk: 4, start: 21, end: 25 }
            - { chunk: 5, start: 26, end: 30 }
            - { chunk: 6, start: 31, end: 35 }
            - { chunk: 7, start: 36, end: 40 }
            - { chunk: 8, start: 41, end: 45 }
            - { chunk: 9, start: 46, end: 50 }
            - { chunk: 10, start: 51, end: 55 }
            - { chunk: 11, start: 56, end: 60 }
            - { chunk: 12, start: 61, end: 65 }
            - { chunk: 13, start: 66, end: 70 }
            - { chunk: 14, start: 71, end: 75 }
            - { chunk: 15, start: 76, end: 80 }
            - { chunk: 16, start: 81, end: 85 }
            - { chunk: 17, start: 86, end: 90 }
            - { chunk: 18, start: 91, end: 95 }
            - { chunk: 19, start: 96, end: 100 }
            - { chunk: 20, start: 101, end: 105 }
            - { chunk: 21, start: 106, end: 110 }
            - { chunk: 22, start: 111, end: 115 }
            - { chunk: 23, start: 116, end: 120 }
            - { chunk: 24, start: 121, end: 125 }
            - { chunk: 25, start: 126, end: 130 }
            - { chunk: 26, start: 131, end: 135 }
            - { chunk: 27, start: 136, end: 140 }
            - { chunk: 28, start: 141, end: 145 }
            - { chunk: 29, start: 146, end: 150 }
            - { chunk: 30, start: 151, end: 155 }
            - { chunk: 31, start: 156, end: 160 }
            - { chunk: 32, start: 161, end: 165 }
            - { chunk: 33, start: 166, end: 170 }
            - { chunk: 34, start: 171, end: 175 }
            - { chunk: 35, start: 176, end: 180 }
            - { chunk: 36, start: 181, end: 185 }
            - { chunk: 37, start: 186, end: 190 }
            - { chunk: 38, start: 191, end: 195 }
            - { chunk: 39, start: 196, end: 200 }
            - { chunk: 40, start: 201, end: 205 }
            - { chunk: 41, start: 206, end: 210 }
            - { chunk: 42, start: 211, end: 215 }
            - { chunk: 43, start: 216, end: 220 }
            - { chunk: 44, start: 221, end: 225 }
            - { chunk: 45, start: 226, end: 230 }
            - { chunk: 46, start: 231, end: 235 }
            - { chunk: 47, start: 236, end: 240 }
            - { chunk: 48, start: 241, end: 245 }
            - { chunk: 49, start: 246, end: 250 }
            - { chunk: 50, start: 251, end: 255 }
            - { chunk: 51, start: 256, end: 260 }
            - { chunk: 52, start: 261, end: 265 }
            - { chunk: 53, start: 266, end: 270 }
            - { chunk: 54, start: 271, end: 275 }
            - { chunk: 55, start: 276, end: 280 }
            - { chunk: 56, start: 281, end: 285 }
            - { chunk: 57, start: 286, end: 290 }
            - { chunk: 58, start: 291, end: 295 }
            - { chunk: 59, start: 296, end: 300 }
            - { chunk: 60, start: 301, end: 305 }
            - { chunk: 61, start: 306, end: 310 }
            - { chunk: 62, start: 311, end: 315 }
            - { chunk: 63, start: 316, end: 320 }
            - { chunk: 64, start: 321, end: 325 }
            - { chunk: 65, start: 326, end: 330 }
            - { chunk: 66, start: 331, end: 335 }
            - { chunk: 67, start: 336, end: 340 }
            - { chunk: 68, start: 341, end: 345 }
            - { chunk: 69, start: 346, end: 350 }
            - { chunk: 70, start: 351, end: 355 }
            - { chunk: 71, start: 356, end: 360 }

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /

      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '5.2'

      - name: Install FFmpeg and headless GL stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libgomp1
          ffmpeg -version | head -1
          # Cycles is CPU-only here, but Blender still opens an offscreen GL
          # context on startup. Without libEGL.so.1 it aborts with SIGABRT
          # (exit 134) before rendering a single frame.
          ldconfig -p | grep -q 'libEGL\.so\.1' || {
            echo "::error::libEGL.so.1 still missing"; exit 1; }

      - name: Prepare chunk directory
        run: mkdir -p "${{ env.SCENE_DIR }}/renders"

      - name: Prove the loop closes before rendering anything
        if: matrix.chunk == 0
        run: |
          blender --factory-startup -b "${{ env.SCENE_DIR }}/scene.blend" \
            -P blender/scripts/inspect_scene.py
          blender --factory-startup -b "${{ env.SCENE_DIR }}/scene.blend" \
            -P blender/scripts/assert_loop.py

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        env:
          ENGINE: ${{ inputs.engine }}
          SAMPLES: ${{ inputs.samples }}
          START_FRAME: ${{ matrix.start }}
          END_FRAME: ${{ matrix.end }}
          SEGMENT_DIR: ${{ env.SCENE_DIR }}/renders
          CHUNK_INDEX: '${{ matrix.chunk }}'
          RES_X: '3840'
          RES_Y: '2160'
          FPS: '30'
          # Headless runners have no GPU: force Mesa's software rasteriser so
          # the offscreen GL context initialises instead of aborting.
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: 'llvmpipe'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          echo "chunk ${{ matrix.chunk }}: $(( ${{ matrix.end }} - ${{ matrix.start }} + 1 )) frames at 3840x2160"
          # --factory-startup is mandatory. The BlenderMCP addon takes a GPU
          # context in background mode and every run then exits silently the
          # moment it starts rendering.
          blender --factory-startup -b "${{ env.SCENE_DIR }}/scene.blend" \
            -P blender/scripts/ci_settings.py \
            -a

      - name: Verify chunk segment
        run: |
          set -euo pipefail
          want=$(( ${{ matrix.end }} - ${{ matrix.start }} + 1 ))
          seg=$(ls -1 "${{ env.SCENE_DIR }}/renders"/seg_${{ matrix.chunk }}_*.mkv 2>/dev/null | head -1 || true)
          if [ -z "$seg" ]; then
            echo "::error::chunk ${{ matrix.chunk }} produced no segment"
            exit 1
          fi
          got=$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames -of csv=p=0 "$seg")
          echo "expected $want frames, got $got"
          if [ "$got" -ne "$want" ]; then
            echo "::error::chunk ${{ matrix.chunk }} rendered $got of $want frames"
            exit 1
          fi

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: seg-${{ inputs.scene }}-${{ matrix.chunk }}
          path: ${{ env.SCENE_DIR }}/renders/seg_${{ matrix.chunk }}_*.mkv
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  collect:
    name: Stitch, QC and encode
    needs: [render]
    if: always() && needs.render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.SCENE_DIR }}/renders
          pattern: seg-${{ inputs.scene }}-*
          merge-multiple: true

      - name: Report chunk inventory
        run: |
          n=$(ls -1 "${{ env.SCENE_DIR }}/renders"/seg_*.mkv 2>/dev/null | wc -l)
          echo "chunks: $n of 72"
          du -sh "${{ env.SCENE_DIR }}/renders"
          echo "CHUNK_COUNT=$n" >> "$GITHUB_ENV"

      - name: Stitch, QC and encode
        env:
          FPS: '30'
          EXPECTED_FRAMES: '360'
          SLUG: ${{ inputs.scene }}
          SEAM_FLOOR_DB: '18'
          SEAM_TOLERANCE_DB: '1.5'
        run: python blender/scripts/encode.py "${{ env.SCENE_DIR }}/renders"

      - name: Verify delivery spec
        run: |
          set -euo pipefail
          f="${{ env.SCENE_DIR }}/renders/${{ inputs.scene }}-4k.mp4"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,pix_fmt -of default=nw=1 "$f" | tee probe.txt
          grep -qx 'width=3840'        probe.txt || { echo "::error::width is not 3840"; exit 1; }
          grep -qx 'height=2160'       probe.txt || { echo "::error::height is not 2160"; exit 1; }
          grep -qx 'r_frame_rate=30/1' probe.txt || { echo "::error::frame rate is not 30fps"; exit 1; }
          grep -q  'pix_fmt=yuv420p'   probe.txt || { echo "::error::not 8-bit 4:2:0"; exit 1; }
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          echo "duration: $dur s"
          awk -v d="$dur" 'BEGIN{ if (d < 11.9 || d > 12.1) { print "::error::duration is not 12s"; exit 1 } }'

      - name: Update delivery checklist
        run: |
          python - <<'PY'
          import json
          path = "blender/scenes/003_pcb-ai-chip-loop/metadata.json"
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          data["delivery"]["fps"] = 30
          data["delivery"]["duration_sec"] = 12
          data["delivery"]["frames"] = 360
          data["loop"]["period_frames"] = 360
          check = data.setdefault("delivery_checklist", {})
          check["3840x2160"] = True
          check["60 fps"] = False
          check["30 fps"] = True
          check["seamless loop verified"] = True
          check["clean encode (no dropped frames)"] = True
          data["status"] = "mastered"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          print("delivery_checklist updated")
          PY

      - name: Delivery notes
        if: always()
        run: |
          {
            echo "### ${{ inputs.scene }}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| resolution | 3840x2160 (4K UHD) |"
            echo "| frame rate | 30 fps |"
            echo "| duration | 12.0 s (360 frames) |"
            echo "| codec | H.264 / yuv420p / Rec.709 |"
            echo "| engine | ${{ inputs.engine }} |"
            echo "| samples | ${{ inputs.samples }} |"
            echo "| chunks | 72 of 5 frames, max-parallel 20 |"
            echo "| chunks received | ${CHUNK_COUNT:-0} |"
            echo
            ls -lh "${{ env.SCENE_DIR }}/renders" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scene }}-4k30
          path: |
            ${{ env.SCENE_DIR }}/renders/*-4k.mp4
            ${{ env.SCENE_DIR }}/renders/*-4k-prores.mkv
            ${{ env.SCENE_DIR }}/renders/*-contact-sheet.jpg
            ${{ env.SCENE_DIR }}/renders/*-poster.png
            ${{ env.SCENE_DIR }}/renders/loop_qc.json
            ${{ env.SCENE_DIR }}/renders/render-report.json
          retention-days: 30
          if-no-files-found: error
